<svg xmlns="http://www.w3.org/2000/svg" width="979" height="1305" viewBox="0 0 979 1305" role="img" aria-labelledby="title description">
  <title id="title">Train UI XL photo coming soon</title>
  <desc id="description">A dark portrait placeholder for the future Train UI XL hardware photograph.</desc>
  <defs>
